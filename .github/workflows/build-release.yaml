name: Build Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  BuildRelease:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Checkout submodules
        run: git submodule update --init --recursive --force

      - name: Checkout Chitanda overlay
        uses: actions/checkout@v4
        with:
          repository: violetaini/chitanda
          ref: main
          path: .chitanda-src

      - name: Apply Chitanda Mihomo overlay
        run: |
          python3 .chitanda-src/scripts/inject-mihomo.py \
            core/src/foss/golang/clash \
            "$GITHUB_WORKSPACE/.chitanda-src"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-download-base-url: 'https://github.com/MetaCubeX/go/releases/download/build'
          go-version: '1.26'

      - name: Apply Patches
        run: |
          cd $(go env GOROOT)
          for p in $GITHUB_WORKSPACE/.github/patch/*.patch; do patch --verbose -p 1 < "$p"; done

      - name: Resolve Chitanda Mihomo dependencies
        run: |
          for module_dir in core/src/foss/golang/clash core/src/foss/golang core/src/main/golang; do
            (
              cd "$module_dir"
              go mod edit -replace=github.com/violetaini/chitanda="$GITHUB_WORKSPACE/.chitanda-src"
              go mod tidy
            )
          done

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Get Version
        id: process-version
        run: |
          VERSION=$(grep -m1 'versionName =' build.gradle.kts | awk -F '"' '{print $2}')
          echo "version=v${VERSION}" >> $GITHUB_OUTPUT
          echo "version_name=${VERSION}" >> $GITHUB_OUTPUT

      - name: Update CA
        run: |
          sudo apt-get update && sudo apt-get install ca-certificates
          sudo update-ca-certificates
          cp -f /etc/ssl/certs/ca-certificates.crt core/src/foss/golang/clash/component/ca/ca-certificates.crt

      - name: Signing properties
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          umask 077
          touch signing.properties
          echo keystore.password="$SIGNING_STORE_PASSWORD" > signing.properties
          echo key.alias="$SIGNING_KEY_ALIAS" >> signing.properties
          echo key.password="$SIGNING_KEY_PASSWORD" >> signing.properties

      - name: Official Release Build
        run: ./gradlew --no-daemon app:assembleMetaRelease

      - name: Publish Official Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: ${{ steps.process-version.outputs.version }}
          name: ${{ steps.process-version.outputs.version }}
          body: |
            Official Release of **ClashMetaForAndroid** `${{ steps.process-version.outputs.version }}` with native **Chitanda Protocol** support.
            
            ### Package Standard:
            - Official Meta Flavor APKs
            - Built with dedicated Chitanda signing key
            - Multi-architecture Android APKs included (arm64-v8a, armeabi-v7a, x86, x86_64, universal)
          files: app/build/outputs/apk/meta/release/*
          draft: false
          prerelease: false
          make_latest: true
          clobber: true
